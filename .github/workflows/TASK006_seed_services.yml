name: TASK006_SEED_SERVICES

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  task006:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and replace files for TASK006
        shell: bash
        run: |
          mkdir -p server/data
          mkdir -p server/api/dev
          mkdir -p server/models
          mkdir -p pages

          cat > server/models/Service.ts <<'EOF'
          import mongoose, { Schema, type InferSchemaType, type Model } from 'mongoose'

          const serviceSchema = new Schema(
            {
              title: {
                type: String,
                required: true,
                trim: true
              },
              category: {
                type: String,
                default: '',
                trim: true
              },
              description: {
                type: String,
                default: ''
              },
              price: {
                type: Number,
                required: true,
                min: 0
              },
              duration: {
                type: Number,
                required: true,
                min: 1
              }
            },
            {
              timestamps: true
            }
          )

          export type ServiceDocument = InferSchemaType<typeof serviceSchema>

          export const Service: Model<ServiceDocument> =
            mongoose.models.Service || mongoose.model<ServiceDocument>('Service', serviceSchema)
          EOF

