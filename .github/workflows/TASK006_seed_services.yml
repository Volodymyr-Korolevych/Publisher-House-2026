          cat > server/api/dev/seed-services.post.ts <<'EOF'
          import { connectToDatabase } from '../../utils/mongodb'
          import { Service } from '../../models/Service'
          import { seedServices } from '../../data/seedServices'

          export default defineEventHandler(async () => {
            await connectToDatabase()

            const count = await Service.countDocuments()

            if (count > 0) {
              return {
                success: false,
                message: 'Послуги вже є в базі даних. Завантаження не виконано.',
                count
              }
            }

            const result = await Service.insertMany(seedServices)

            return {
              success: true,
              message: 'Послуги успішно завантажено в базу даних.',
              count: result.length
            }
          })
          EOF

          cat > pages/services.vue <<'EOF'
          <script setup lang="ts">
          type ServiceItem = {
            _id: string
            title: string
            category?: string
            description: string
            price: number
            duration: number
          }

          const { data: services, pending, error, refresh } = await useFetch<ServiceItem[]>('/api/services')

          const seedMessage = ref('')
          const seedError = ref('')
          const seedLoading = ref(false)

          const groupedServices = computed(() => {
            const list = Array.isArray(services.value) ? services.value : []
            const groups: Record<string, ServiceItem[]> = {}

            for (const service of list) {
              const category = service.category || 'Інші послуги'

              if (!groups[category]) {
                groups[category] = []
              }

              groups[category].push(service)
            }

            return groups
          })

          async function seedServices() {
            seedMessage.value = ''
            seedError.value = ''
            seedLoading.value = true

            try {
              const response = await $fetch<{ success: boolean; message: string; count: number }>('/api/dev/seed-services', {
                method: 'POST'
              })

              if (response.success) {
                seedMessage.value = `${response.message} Додано: ${response.count}.`
                await refresh()
              } else {
                seedError.value = `${response.message} Поточна кількість: ${response.count}.`
              }
            } catch (err: any) {
              seedError.value = err?.data?.statusMessage || 'Не вдалося завантажити послуги.'
            } finally {
              seedLoading.value = false
            }
          }
          </script>

          <template>
            <section class="mx-auto max-w-6xl px-4 py-10">
              <div class="mb-6 flex flex-wrap items-start justify-between gap-4">
                <div>
                  <h1 class="text-3xl font-bold">Послуги</h1>
                  <p class="mt-2 text-stone-600">
                    Перелік послуг перукарні, згрупований за категоріями.
                  </p>
                </div>

                <button
                  type="button"
                  :disabled="seedLoading"
                  class="rounded-xl border border-brand-700 px-4 py-2 text-sm font-medium text-brand-700 transition hover:bg-brand-50 disabled:cursor-not-allowed disabled:opacity-60"
                  @click="seedServices"
                >
                  {{ seedLoading ? 'Завантаження...' : 'Завантажити стартові послуги' }}
                </button>
              </div>

              <div
                v-if="seedMessage"
                class="mb-4 rounded-xl border border-green-200 bg-green-50 p-4 text-sm text-green-700"
              >
                {{ seedMessage }}
              </div>

              <div
                v-if="seedError"
                class="mb-4 rounded-xl border border-amber-200 bg-amber-50 p-4 text-sm text-amber-800"
              >
                {{ seedError }}
              </div>

              <div
                class="mb-6 rounded-xl border border-amber-200 bg-amber-50 p-4 text-sm text-amber-800"
              >
                Кнопка завантаження послуг є тимчасовою. Після одноразового заповнення бази даних її можна буде прибрати.
              </div>

              <div v-if="pending" class="text-stone-500">
                Завантаження...
              </div>

              <div v-else-if="error" class="rounded-xl border border-red-200 bg-red-50 p-4 text-red-700">
                Не вдалося завантажити список послуг.
              </div>

              <div v-else class="space-y-8">
                <section
                  v-for="(items, category) in groupedServices"
                  :key="category"
                >
                  <div class="mb-4 border-b border-stone-300 pb-2">
                    <h2 class="text-2xl font-semibold text-stone-900">
                      {{ category }}
                    </h2>
                  </div>

                  <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
                    <article
                      v-for="service in items"
                      :key="service._id"
                      class="rounded-2xl border border-stone-200 bg-white p-5 shadow-sm"
                    >
                      <h3 class="mb-2 text-xl font-semibold">{{ service.title }}</h3>
                      <p class="mb-3 text-stone-600">{{ service.description }}</p>
                      <div class="flex items-center justify-between text-sm text-stone-500">
                        <span>{{ service.duration }} хв</span>
                        <span class="font-medium text-stone-800">{{ service.price }} грн</span>
                      </div>
                    </article>
                  </div>
                </section>

                <article
                  v-if="Array.isArray(services) && services.length === 0"
                  class="rounded-2xl border border-dashed border-stone-300 bg-white p-5 text-stone-500"
                >
                  У базі даних поки немає послуг. Натисніть кнопку “Завантажити стартові послуги”.
                </article>
              </div>
            </section>
          </template>
          EOF

      - name: Commit TASK006 changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "TASK006: add service categories and seed services"
          git push
